<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swedish Reader</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <section id="audio-player-bar" class="audio-player-bar" aria-label="Audio player" hidden>
    <audio id="audio-player" preload="metadata"></audio>
    <div class="audio-controls">
      <button id="audio-previous" type="button" aria-label="Previous sentence" title="Previous sentence">|◀</button>
      <button id="audio-play" type="button" aria-label="Play" title="Play">▶</button>
      <button id="audio-stop" type="button" aria-label="Stop" title="Stop">■</button>
      <button id="audio-next" type="button" aria-label="Next sentence" title="Next sentence">▶|</button>
      <div id="audio-speed-control" class="audio-speed">
        <button id="audio-speed-toggle" class="audio-speed-toggle" type="button" aria-label="Playback speed: 1.0×" aria-expanded="false" aria-controls="audio-speed-popover" disabled>Speed 1.0× ▾</button>
        <div id="audio-speed-popover" class="audio-speed-popover" hidden>
          <div class="audio-speed-heading">
            <label for="audio-speed">Playback speed</label>
            <output id="audio-speed-value" for="audio-speed">1.0×</output>
          </div>
          <input id="audio-speed" type="range" min="0.5" max="2" step="0.1" value="1" list="audio-speed-stops" aria-label="Playback speed">
        </div>
      </div>
    </div>
    <datalist id="audio-speed-stops">
      <option value="0.5"></option>
      <option value="0.6"></option>
      <option value="0.7"></option>
      <option value="0.8"></option>
      <option value="0.9"></option>
      <option value="1"></option>
      <option value="1.1"></option>
      <option value="1.2"></option>
      <option value="1.3"></option>
      <option value="1.4"></option>
      <option value="1.5"></option>
      <option value="1.6"></option>
      <option value="1.7"></option>
      <option value="1.8"></option>
      <option value="1.9"></option>
      <option value="2"></option>
    </datalist>
    <input id="audio-seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="Audio position">
    <div class="audio-status-row">
      <span id="audio-status" role="status"></span>
      <span id="audio-time">0:00 / 0:00</span>
    </div>
  </section>
  <main>
    <div id="error" role="alert" hidden></div>
    <header class="reader-header">
      <a href="index.html">Library</a>
      <label>Text <select id="doc-select"></select></label>
    </header>
    <h1 id="doc-title"></h1>
    <p id="byline" class="muted"></p>
    <article id="text" lang="sv"></article>
    <aside id="reading-complete" class="reading-complete" hidden></aside>
    <footer id="attribution"></footer>
    <p class="site-links"><a href="licenses.html">Licences and credits</a></p>
  </main>
  <aside id="panel" hidden aria-live="polite"></aside>
  <script src="tracker.js?v=5"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
