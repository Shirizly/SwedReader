name: Deploy reader to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["reader/**", "sources.yaml", "pipeline/**", "scripts/generate_audio.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that only public documents are published
        run: |
          pip install pyyaml
          python -m pipeline.guard
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader
      - id: deployment
        uses: actions/deploy-pages@v4
